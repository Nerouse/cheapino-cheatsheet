<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CHEAPINO — Keymap Reference</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<noscript><div style="padding:32px;text-align:center;color:#85858D;font-family:system-ui,sans-serif"><p>⚠ JavaScript is required for this app. Please enable it.</p></div></noscript>

<!-- ═══ HEADER ═══ -->
<header class="topbar">
  <div class="topbar-l">
    <span class="topbar-brand"><span class="ac">⌨</span> CHEAPINO</span>
  </div>
  <div class="topbar-c">
    <select id="profile-select" class="profile-dropdown" aria-label="Select profile"></select>
    <span id="profile-desc" class="profile-desc"></span>
  </div>
  <div class="topbar-r">
    <button class="icobtn" id="btn-files" title="Browse files">📁</button>
    <button class="icobtn" id="btn-docs" title="Documentation">📖</button>
    <a class="icobtn" href="https://github.com/Nerouse/cheapino-cheatsheet" target="_blank" title="GitHub repo">🐙</a>
  </div>
</header>

<!-- ═══ LAYER TABS ═══ -->
<div id="layer-tabs" class="layer-tabs"></div>

<!-- ═══ KEYBOARD VISUAL ═══ -->
<main class="keymap-area">
  <div id="keymap-visual">
    <div class="empty-state"><p>Loading keymap…</p></div>
  </div>
</main>

<!-- ═══ DRAWER OVERLAY ═══ -->
<div id="drawer-overlay" class="drawer-overlay"></div>

<!-- ═══ DRAWER (Files / Docs) ═══ -->
<aside id="drawer" class="drawer">
  <div class="drawer-head">
    <span id="drawer-title">Files</span>
    <button id="drawer-close" class="icobtn">&times;</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<!-- ═══ FOOTER ═══ -->
<footer class="footer">CHEAPINO ⌨ v2</footer>

<script src="js/app.js"></script>
</body>
</html>
