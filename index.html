<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1.0"><title>KEYMAP · V3</title><style>:root{--bg:#101014;--s:#16161C;--s2:#1C1C24;--b:rgba(242,241,238,0.12);--t:#F2F1EE;--td:#85858D;--tm:#55555E;--bl:#6B9EFF;--bt:rgba(107,158,255,0.06);--bb:#F2F1EE;--bn:#6B9EFF;--bnm:#85858D;--bw:#55555E;--bbr:#383840}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);background-image:linear-gradient(rgba(242,241,238,0.045) 1px,transparent 1px),linear-gradient(90deg,rgba(242,241,238,0.045) 1px,transparent 1px);background-size:72px 72px;color:var(--t);font-family:system-ui,sans-serif;min-height:100vh}.wrap{max-width:960px;margin:0 auto;padding:0 16px}.nav{position:sticky;top:0;z-index:100;background:rgba(16,16,20,0.92);border-bottom:1px solid var(--b);height:clamp(52px,6vh,68px);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(12px,2vw,32px)}.nav .br{font:700 13px/1 'Courier New',monospace;text-transform:uppercase;letter-spacing:.12em;color:var(--t)}.nav .br .ac{color:var(--bl)}.nav .mi{font:600 9px/1 'Courier New',monospace;text-transform:uppercase;letter-spacing:.16em;color:var(--td);display:flex;gap:clamp(8px,1.2vw,20px)}.nav .mi span:hover{color:var(--t)}.nav .mi a{color:inherit;text-decoration:none}.nav .mi a:hover{color:var(--t)}.nav .btn{font:700 9px/1 'Courier New',monospace;background:var(--t);color:var(--bg);padding:8px 14px;border:none}.hero{text-align:center;padding:clamp(24px,4vw,48px) 0 clamp(14px,2vw,28px);border-bottom:1px solid var(--b);margin-bottom:clamp(10px,1.2vw,20px)}.hero .lbl{font:700 10px/1 'Courier New',monospace;text-transform:uppercase;letter-spacing:.2em;color:var(--bl);margin-bottom:clamp(4px,.5vw,8px)}.hero h1{font:900 clamp(1.8rem,5vw,3.2rem)/.9 'Arial Black',sans-serif;text-transform:uppercase;letter-spacing:-.06em;color:var(--t)}.hero h1 .ac{color:var(--bl)}.hero .sub{font:500 clamp(.7rem,.9vw,.9rem)/1.4 system-ui,sans-serif;color:var(--td);margin-top:clamp(4px,.4vw,8px)}.lbar{display:flex;justify-content:center;gap:clamp(6px,1.2vw,20px);flex-wrap:wrap;padding:clamp(6px,.6vw,12px);margin:clamp(4px,.4vw,8px) 0;border:1px solid var(--b)}.lbar span{display:inline-flex;align-items:center;gap:5px;font:600 9px/1 'Courier New',monospace;text-transform:uppercase;letter-spacing:.16em;color:var(--td)}.lbar .sw{display:inline-block;width:9px;height:9px}.grid{display:grid;grid-template-columns:1fr;gap:1px;max-width:960px;margin:0 auto;border:1px solid var(--b);background:var(--b)}
